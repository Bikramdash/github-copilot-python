<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="app-header">
      <h1>Sudoku Game</h1>
    </header>

    <div class="game-stage" aria-label="Sudoku game area">
      <aside class="side-panel game-controls-left" aria-label="Game timer settings">
        <div id="timer-container" aria-live="polite">
          <span class="timer-label">Time</span>
          <span id="timer-display">00:00</span>
        </div>

        <div class="difficulty-control">
          <label for="difficulty-select">Difficulty</label>
          <select id="difficulty-select">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
      </aside>

      <div class="board-wrap">
        <div id="sudoku-board" aria-label="Sudoku board"></div>
      </div>

      <aside class="side-panel game-controls-right" aria-label="Game actions panel">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle between light and dark mode" aria-pressed="false">Dark Mode</button>
        <button id="get-hint" type="button">Hint</button>
      </aside>
    </div>

    <div class="action-row" aria-label="Game actions">
      <button id="new-game" type="button">New Game</button>
      <button id="check-solution" type="button">Check Puzzle</button>
      <button id="undo-move" type="button">Undo</button>
      <button id="redo-move" type="button">Redo</button>
    </div>

    <div id="message" class="message" aria-live="polite"></div>

    <div id="leaderboard-container" aria-live="polite">
      <div class="panel-header">
        <h2>Leaderboard</h2>
        <button id="reset-leaderboard" class="panel-reset" type="button">Reset</button>
      </div>
      <table id="leaderboard-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Name</th>
            <th>Time</th>
            <th>Difficulty</th>
            <th>Hints</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="completion-modal" class="completion-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="completion-modal-title">
      <div class="completion-modal-backdrop" aria-hidden="true"></div>
      <div class="completion-modal-panel">
        <button id="completion-modal-close" class="completion-modal-close" type="button" aria-label="Close completion dialog">×</button>
        <h2 id="completion-modal-title">Puzzle Complete!</h2>
        <div id="completion-modal-content"></div>
        <div class="completion-modal-actions">
          <button id="completion-play-again" type="button" class="completion-primary-action">Play Again</button>
          <button id="completion-close-button" type="button" class="completion-secondary-action">Close</button>
        </div>
      </div>
    </div>

    <div id="statistics-container" aria-live="polite">
      <div class="panel-header">
        <h2>Statistics</h2>
        <button id="reset-statistics" class="panel-reset" type="button">Reset</button>
      </div>
      <div id="statistics-panel"></div>
    </div>
  </div>

  <script src="/static/timer.js"></script>
  <script src="/static/leaderboard.js"></script>
  <script src="/static/statistics.js"></script>
  <script src="/static/theme.js"></script>
  <script src="/static/save-load.js"></script>
  <script src="/static/completion-modal.js"></script>
  <script src="/static/keyboard-navigation.js"></script>
  <script src="/static/main.js"></script>
</body>
</html>
